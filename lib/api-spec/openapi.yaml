      type: object
      required: [status, sample_size, correct, incorrect, uncertain, observed_accuracy, unsupported_claim_rate, methodology, reviews]
      properties:
        status: { type: string }
        sample_size: { type: integer }
        correct: { type: integer }
        incorrect: { type: integer }
        uncertain: { type: integer }
        observed_accuracy: { type: [number, "null"], description: Percent correct / all reviewed including uncertain; null until reviewed }
        unsupported_claim_rate: { type: [number, "null"] }
        methodology: { type: string }
        reviews: { type: array, items: { $ref: "#/components/schemas/ReviewRecord" } }
    QuestionInput:
      type: object
      required: [question, filters]
      properties:
        question: { type: string, minLength: 1, maxLength: 2000 }
        filters: { $ref: "#/components/schemas/Filters" }
