        sample_size: { type: integer, minimum: 1, maximum: 20, default: 12 }
        regenerate: { type: boolean, default: false }
    Evidence:
      type: object
      required: [ticket_id, excerpt, field]
      properties:
        ticket_id: { type: string }
        excerpt: { type: string }
        field: { type: string, enum: [customer_message, agent_notes] }
    AiProvenance:
      type: object
      required: [dataset_version, model, prompt_version, taxonomy_version, generated_at, cached, token_usage, cost_note]
      properties:
        dataset_version: { type: string }
        model: { type: string }
        prompt_version: { type: string }
        taxonomy_version: { type: string }
        generated_at: { type: string }
        cached: { type: boolean }
        token_usage: { type: [integer, "null"] }
        cost_note: { type: string }
    Insight:
      type: object
      required: [id, observation, evidence_summary, hypothesis, confidence, limitation, investigation, evidence]
      properties:
        id: { type: string }
        observation: { type: string }
        evidence_summary: { type: string }
        hypothesis: { type: string }
        confidence: { type: string, enum: [low, medium, high] }
        limitation: { type: string }
        investigation: { type: string }
        evidence: { type: array, items: { $ref: "#/components/schemas/Evidence" } }
    InsightsResult:
      type: object
      required: [status, message, insights, classifications, evaluation_status, filters]
      properties:
        status: { type: string, enum: [ready, not_generated, unavailable, error] }
        message: { type: string }
        insights: { type: array, items: { $ref: "#/components/schemas/Insight" } }
        classifications: { type: array, items: { $ref: "#/components/schemas/Classification" } }
        provenance: { $ref: "#/components/schemas/AiProvenance" }
        evaluation_status: { type: string }
        filters: { $ref: "#/components/schemas/Filters" }
    Classification:
      type: object
      required: [id, ticket_id, category, source_category, rationale, confidence, evidence, taxonomy_version, review_status]
      properties:
        id: { type: string }
        ticket_id: { type: string }
        category: { type: string }
        source_category: { type: string }
        rationale: { type: string }
        confidence: { type: string, enum: [low, medium, high] }
        evidence: { type: array, items: { $ref: "#/components/schemas/Evidence" } }
        taxonomy_version: { type: string }
        review_status: { type: string, enum: [unreviewed, correct, incorrect, uncertain] }
    TaxonomyCategory:
      type: object
      required: [name, definition]
      properties:
        name: { type: string }
        definition: { type: string }
    ClassificationResult:
      type: object
      required: [status, message, classifications, taxonomy, evaluation_status]
      properties:
        status: { type: string, enum: [ready, unavailable, error] }
        message: { type: string }
        classifications: { type: array, items: { $ref: "#/components/schemas/Classification" } }
        taxonomy: { type: array, items: { $ref: "#/components/schemas/TaxonomyCategory" } }
        provenance: { $ref: "#/components/schemas/AiProvenance" }
        evaluation_status: { type: string }
    EvaluationInput:
      type: object
      required: [classification_id, verdict, reviewer]
      properties:
        classification_id: { type: string }
        verdict: { type: string, enum: [correct, incorrect, uncertain] }
        reviewer: { type: string, minLength: 1, maxLength: 100 }
        note: { type: string, maxLength: 2000 }
        unsupported_claim: { type: boolean }
    ReviewRecord:
      type: object
      required: [classification_id, ticket_id, verdict, reviewer, note, reviewed_at]
      properties:
        classification_id: { type: string }
        ticket_id: { type: string }
        verdict: { type: string, enum: [correct, incorrect, uncertain] }
        reviewer: { type: string }
        note: { type: string }
        reviewed_at: { type: string }
        unsupported_claim: { type: [boolean, "null"] }
