        description: { type: string }
        ticket_ids: { type: array, items: { type: string } }
    AnswerResult:
      type: object
      required: [status, answer, evidence, tool_calls, limitations, filters]
      properties:
        status: { type: string, enum: [ready, unavailable, error, insufficient_evidence] }
        answer: { type: string }
        evidence: { type: array, items: { $ref: "#/components/schemas/Evidence" } }
        tool_calls: { type: array, items: { $ref: "#/components/schemas/ToolTrace" } }
        limitations: { type: array, items: { type: string } }
        filters: { $ref: "#/components/schemas/Filters" }
        provenance: { $ref: "#/components/schemas/AiProvenance" }
        context_id: { type: string, description: Pass back for a bounded follow-up about this finding; clear when filters change. }
    BriefInput:
      type: object
      required: [filters]
      properties:
        filters: { $ref: "#/components/schemas/Filters" }
